<template>
    <lightning-card title="Quiz App in LWC" icon-name="standard:Opportunity" variant="base">
      <div class="slds-m-around_large">
        <form action="">
          <template for:each={myQuestions} for:item="quiz" for:index="i">
            <div key={quiz.id} class="slds-m-bottom_medium">
              <div><strong>{quiz.id} - {quiz.question}</strong></div>
                <div class="slds-grid slds-gutters">
                  <div class="slds-col slds-size_1-of-3">
                    <span>                
                    <input type="radio" name={quiz.id} value="a" onchange={changeHandler}/>
                    {quiz.answers.a}
                    </span>
                  </div>
                  <div class="slds-col slds-size_1-of-3">
                    <input type="radio" name={quiz.id} value="b" onchange={changeHandler}/>
                    <span>{quiz.answers.b}</span></div>
                  <div class="slds-col slds-size_1-of-3">
                    <input type="radio" name={quiz.id} value="c" onchange={changeHandler}/>
                    <span>{quiz.answers.c}</span></div>
                </div>
            </div>
          </template>
          <lightning-button variant="brand" title="Submit quiz" type="submit" label="Submit" class="slds-m-around_small" disabled={allNotSelected} onclick={submitHandler}>
          </lightning-button>
          <lightning-button variant="brand" title="Rest quiz" type="Reset" label="Reset" class="slds-m-around_small" onclick={resetHandler}>
          </lightning-button>          
        </form>
        <template lwc:if={submitted}>
            <div class="slds-m-around_small">You got {correctAnswers} out of {myQuestions.length}</div>
        </template>
      </div>
    </lightning-card>
</template>
